name: Build

# Build only; releases are built and uploaded locally (./gradlew release -Prelease_version=…, gradle/release.gradle)
on:
  push:
    branches: ["1.12", "1.12-dev"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/libs/*.jar
