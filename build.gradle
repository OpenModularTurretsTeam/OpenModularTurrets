
buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}
plugins {
    id "com.matthewprenger.cursegradle" version "1.4.0"
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'maven-publish'
apply plugin: 'idea'
apply plugin: 'java'
// tests, core isolation and changelog tasks, shared with the workspace build
apply from: "gradle/mod-common.gradle"

repositories {
    maven { url = "https://maven.blamejared.com/" }  // JEI, Tesla
    maven { url = "https://maven.covers1624.net/" }  // RedstoneFlux
    maven { url = "https://maven.cil.li/" }          // OpenComputers
    maven { url = "https://modmaven.dev/" }          // The One Probe
    maven { url = "https://cursemaven.com/" }        // OMLib releases from CurseForge
    if (project.hasProperty("omlib_local")) {
        mavenLocal()                                 // OMLib from publishToMavenLocal
    }
    // Hwyla; keep last, it redirects unknown paths to a non-maven site
    maven { url = "https://maven.tehnut.info/" }
}

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = "1.8"

version = "${mod_version}"
if (hasProperty("appendBuildNumber")) {
    version = version + "-" + appendBuildNumber.toString()
} else {
    version = version + "-0"
}

group = "${group_id}" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "${mod_id}-${minecraft_version}"

String omlib_max_version = omlib_version.toString().replaceAll("[0-9]-[0-9]*", "99-9999")

minecraft {
    version = "${forge_version}"
    runDir = "run"

    replace "@VERSION@", project.version
    replace "omlib@[0.0.0,)", "omlib@[" + omlib_version + "," + omlib_max_version + ")"

    // the mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   snapshot are built nightly.
    // stable_#            stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not always work.
    // simply re-run your setup task after changing the mappings to update your workspace.
    mappings = "snapshot_20171212"
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
    useDepAts = true
}

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"

        // replace version and mcversion
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}

configurations {
    runtime.exclude group: "ValkyrienWarfareRevamped", module: "valkyrienwarfare"
}

dependencies {
    deobfProvided "mezz.jei:jei_${minecraft_version}:${jei_version}:api"
    testCompile "mezz.jei:jei_${minecraft_version}:${jei_version}:api"
    compile "mcp.mobius.waila:Hwyla:${hwyla_version}_${minecraft_version}:api"
    testCompile "mcp.mobius.waila:Hwyla:${hwyla_version}_${minecraft_version}:api"
    deobfProvided "cofh:RedstoneFlux:${minecraft_version_short}-${redstoneflux_version}:universal"
    testCompile "cofh:RedstoneFlux:${minecraft_version_short}-${redstoneflux_version}:universal"
    deobfProvided "mcjty.theoneprobe:TheOneProbe-${minecraft_version_short}:${minecraft_version_short}-${top_version}"
    testCompile "mcjty.theoneprobe:TheOneProbe-${minecraft_version_short}:${minecraft_version_short}-${top_version}"
    deobfProvided "li.cil.oc:OpenComputers:MC${minecraft_version}-${oc_version}"
    testCompile "li.cil.oc:OpenComputers:MC${minecraft_version}-${oc_version}"
    deobfProvided "net.darkhax.tesla:Tesla-${minecraft_version_short}:${tesla_version}"
    testCompile "net.darkhax.tesla:Tesla-${minecraft_version_short}:${tesla_version}"
    // -Pomlib_local builds against an OMLib from `gradlew publishToMavenLocal` instead of the CurseForge release
    if (project.hasProperty("omlib_local")) {
        compileOnly "omtteam:omlib:${minecraft_version}-${omlib_version}:dev"
        testCompile "omtteam:omlib:${minecraft_version}-${omlib_version}:dev"
    } else {
        deobfProvided "curse.maven:omlib-254334:${omlib_curse_file_id}"
        testCompile "curse.maven:omlib-254334:${omlib_curse_file_id}"
    }
}


task deobfJar(type: Jar) {
    from sourceSets.main.output
    classifier = "dev"
}

tasks.build.dependsOn deobfJar, sourceJar

publishing {
    tasks.publish.dependsOn "build"
    publications {
        mavenJava(MavenPublication) {
            groupId group_prefix
            version minecraft_version + "-" + project.version
            artifactId mod_id
            artifact jar
            artifact sourceJar
            artifact deobfJar
        }
    }
    repositories {
        mavenLocal()
    }
}

//// CURSE RELEASE \\\\
// release_type (alpha, beta or release) is set by the CI release job from the git tag

def curse_release_type = findProperty("release_type") ?: "none"
if (!(curse_release_type in ["none", "alpha", "beta", "release"])) {
    throw new GradleException("Unknown release_type '${curse_release_type}', expected alpha, beta or release")
}

// The CHANGELOG.md section of the release tag (CI passes -Pchangelog_version); a release without one fails
def releaseNotes = ""
if (curse_release_type != "none") {
    def changelogVersion = findProperty("changelog_version")
    releaseNotes = changelogVersion ? changelogSection(changelogVersion) : null
    if (!releaseNotes) {
        throw new GradleException("CHANGELOG.md has no section for '${changelogVersion}'; run ./gradlew releaseChangelog -Pchangelog_version=<tag without v> first")
    }
}

tasks.curseforge.enabled = project.hasProperty("curseforge_key") && curse_release_type != "none"
curseforge {
    if (project.hasProperty("curseforge_key") && curse_release_type != "none") {
        System.out.println("ATTEMPTING CURSE RELEASE")
        apiKey = project.properties["curseforge_key"]
    } else {
        return
    }
    project {
        id = curse_project_id
        addGameVersion "1.12.2"
        addGameVersion "Forge"

        relations {
            requiredDependency "omlib"
            optionalDependency "ompd"
            optionalDependency "ender-io"
            optionalDependency "redstone-flux"
            optionalDependency "thermal-expansion"
            optionalDependency "mekanism"
            optionalDependency "opencomputers"
            optionalDependency "computercraft"
        }

        mainArtifact(jar) {
            releaseType = curse_release_type
            changelog = releaseNotes
            changelogType = "markdown"
        }

        addArtifact(sourceJar) {
            releaseType = "alpha"
            changelog = releaseNotes
            changelogType = "markdown"
        }

        addArtifact(deobfJar) {
            releaseType = "alpha"
            changelog = releaseNotes
            changelogType = "markdown"
        }
    }
}
