# Forge 1.20.1. The mixin config is named in the jar manifest (MixinConfigs), not here; MixinExtras is bundled.
modLoader = "javafml"
loaderVersion = "${forge_loader_range}"
license = "MIT (code), CC-BY-NC-SA-4.0 (art)"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "Poenjabiesous, UntouchedWagons, Keridos"
description = "All a man needs are meat ingots, and big ass turrets. Adds a heap of new turrets and upgrades!"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/openmodularturrets/"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_dependency}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_dependency}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jade"
mandatory = false
versionRange = "*"
ordering = "NONE"
side = "BOTH"
