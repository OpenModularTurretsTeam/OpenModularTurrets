minecraft_version=1.20.1
# Version range in mods.toml (Maven range syntax)
minecraft_dependency=[1.20.1,1.20.2)
java_version=17
# Forge version for ModDevGradle (legacy) and the range in mods.toml
forge_version=1.20.1-47.4.28
forge_dependency=[47.4.28,)
# FML version range in mods.toml (javafml 47 = Forge 1.20.1)
forge_loader_range=[47,)
jade_version=11.13.3+forge
# MixinExtras, bundled into the Forge jar only (Fabric Loader and NeoForge ship it)
mixinextras_version=0.5.5
# Test build: never uploaded, even with tokens (see publish_enabled in buildSrc/mod-common)
publish_enabled=false
# Data (recipes, loot tables, tags …) is copied from this node's datagen output, with Forge load conditions
datagen_from=1.20.1-fabric
