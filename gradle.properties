org.gradle.jvmargs=-Xmx3G
# Forge 14.23.5.2847 (chosen by RetroFuturaGradle); MCP mappings stable_39 (the final 1.12 names), the same in all OMTTeam 1.12 mods
mcp_mapping_channel=stable
mcp_mapping_version=39
# Version (gradle/mod-common.gradle): mod_version, release_type alpha|beta|release and, for alpha/beta, release_number;
# 4.0.0 + alpha + 1 = 4.0.0-alpha.1, a release is the plain 4.0.0
mod_version=4.0.0
release_type=beta
release_number=1
minecraft_version=1.12.2
minecraft_version_short=1.12
group_prefix=omtteam
group_id=omtteam.openmodularturrets
mod_id=openmodularturrets
mod_id_cap=OpenModularTurrets
curse_project_id=224663
# CurseForge relations (gradle/release.gradle), comma-separated <project slug>:<requiredDependency|optionalDependency|embeddedLibrary|incompatible|tool>
curse_relations=omlib:requiredDependency,ompd:optionalDependency,ender-io:optionalDependency,redstone-flux:optionalDependency,thermal-expansion:optionalDependency,mekanism:optionalDependency,opencomputers:optionalDependency,computercraft:optionalDependency
libs_dir=libs/
# Modrinth project id (gradle/release.gradle); empty or TODO: no Modrinth upload
modrinth_project_id=TODO
# Modrinth dependencies, comma-separated <project id>:<required|optional|incompatible|embedded>
modrinth_dependencies=TODO_OMLIB:required,TODO_OMPD:optional
# OM Dependencies
# The OMLib version (as set in OMLib's gradle.properties) the jar needs at least; releases build against it from mavenLocal
omlib_version=4.0.0-beta.1
# CurseForge file id of the OMLib release to build against (curse.maven:omlib-254334:<id>)
omlib_curse_file_id=3086478
# Mod Implementations
jei_version=4.15.0.268
top_version=1.4.28-17
# Hwyla 1.8.26-B41: its CurseForge file id (curse.maven:hwyla-253449:<id>)
hwyla_curse_file_id=2568751
oc_version=1.7.4.157
# For Energy systems
ic2_version=2.8.75-ex112
tesla_version=1.0.61
redstoneflux_version=2.1.0.7
# For Testing
enderio_version=3.0.1.138_beta
endercore_version=0.4.1.60-beta
# Compatibility
# Tests (gradle/mod-common.gradle)
junit_version=5.13.4
junit_platform_version=1.13.4
archunit_version=1.3.0
# 3.x is the last EqualsVerifier line running on Java 8
equalsverifier_version=3.19.4
# Test coverage of core (printed by check)
jacoco_version=0.8.15
# Mutation testing of core (./gradlew pitest, on demand); PIT 1.17 is the last release running on Java 8
pitest_version=1.17.4
pitest_junit5_version=1.2.1
