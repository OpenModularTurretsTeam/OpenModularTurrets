# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Mod (shared across all Minecraft versions)
mod_id=openmodularturrets
mod_name=Open Modular Turrets
mod_version=4.0.0-beta.4
maven_group=omtteam.openmodularturrets
archives_base_name=openmodularturrets

# Shared dependencies
fabric_loader_version=0.19.5
junit_version=6.1.3
# Architecture rules as unit tests (test only)
archunit_version=1.5.1
# Code quality report (./gradlew pmdMain pmdClient, report only)
pmd_version=7.28.0
# Test coverage of core and api (printed by check, active version only)
jacoco_version=0.8.15
# Mutation testing of core (./gradlew :1.21.1:pitest, on demand)
pitest_version=1.30.0
pitest_junit5_version=1.2.3

# Publishing (./gradlew chiseledPublish). Tokens are NOT stored here: set the environment variables
# CURSEFORGE_TOKEN / MODRINTH_TOKEN, or curseforge_token / modrinth_token in ~/.gradle/gradle.properties.
# Without a token the upload for that site runs as a dry run.
# release_type: release, beta or alpha
release_type=beta
curseforge_project_id=224663
modrinth_project_id=GEFsJ5uX
