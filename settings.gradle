pluginManagement {
    repositories {
        // RetroFuturaGradle (the Forge 1.12.2 toolchain)
        maven {
            name = "GTNH"
            url = "https://nexus.gtnewhorizons.com/repository/public/"
            mavenContent {
                includeGroup("com.gtnewhorizons")
                includeGroup("com.gtnewhorizons.retrofuturagradle")
            }
        }
        gradlePluginPortal()
        mavenCentral()
    }
    // also the versions of the OMTTeam 1.12 workspace, which includes this build file
    plugins {
        id "com.gtnewhorizons.retrofuturagradle" version "2.0.6"
    }
}

plugins {
    // provisions the Java 8 toolchain (Azul) if it is not installed
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "openmodularturrets"
