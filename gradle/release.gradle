// Local releases to CurseForge and Modrinth, used by the mod's own build (build.gradle), not by the workspace.
// Keep this file identical in OMLib, OMT and OMPD. Apply it after gradle/mod-common.gradle, which sets the version.
//
// The version comes from gradle.properties (mod_version, release_type, release_number; see mod-common.gradle).
// In a release commit, set it there (OMT and OMPD also omlib_version) and run ./gradlew releaseChangelog, then:
//
//   ./gradlew release
//
// (in the mod folder: the mod's own settings.gradle keeps Gradle from using the workspace above it)
// `release` checks the release commit, builds, uploads to CurseForge (`curseforge`) and Modrinth (`modrinth`) with
// the version's CHANGELOG.md section and tags the commit as v<version>.
//
// Tokens come from ~/.gradle/gradle.properties: curseforge_token, modrinth_token.
// OMT and OMPD: if omlib_version changed since the previous release tag, the version's CHANGELOG.md section has to
// mention "OMLib <omlib_version>" (checkOmlibChangelog, which checkRelease and every upload depend on).
// Per mod (gradle.properties):
//   curse_project_id, curse_relations (comma-separated <project slug>:<requiredDependency|optionalDependency|
//   embeddedLibrary|incompatible|tool>),
//   modrinth_project_id (empty or TODO…: no Modrinth upload), modrinth_dependencies (comma-separated
//   <project id>:<required|optional|incompatible|embedded>).
// The uploads talk to the APIs directly (written when the build was on Gradle 4, where CurseGradle 1.4 rejected the
// Client / Server environments CurseForge requires).
// The uploaded jar is reobfJar (SRG names); the dev jar (MCP names) and the sources jar go up as additional files.

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

// A build that uploads; only then do OMT and OMPD build against the OMLib release in mavenLocal
def releaseTasks = ["release", "checkRelease", "curseforge", "modrinth"]
ext.releasing = gradle.startParameter.taskNames.any { it.tokenize(":").last() in releaseTasks }
ext.releaseNotes = changelogSection(version.toString())

/** A gradle.properties value, null if it is empty or still a TODO placeholder. */
def configured = { String name ->
    String value = findProperty(name)?.toString()?.trim()
    return value && !value.startsWith("TODO") ? value : null
}
String modrinthProjectId = configured("modrinth_project_id")
String modrinthApi = findProperty("modrinth_api_url") ?: "https://api.modrinth.com/v2"
String curseforgeApi = findProperty("curseforge_api_url") ?: "https://minecraft.curseforge.com/api"
// CurseForge game versions of every file: Minecraft version, loader and environments
List<String> curseGameVersions = [minecraft_version.toString(), "Forge", "Client", "Server"]
String userAgent = "OpenModularTurretsTeam/${mod_id} (https://github.com/OpenModularTurretsTeam)"

/** Parses a comma-separated list of <name>:<type> entries from gradle.properties. */
def typedList = { String property, List<String> types ->
    String list = findProperty(property)?.toString()?.trim()
    return list ? list.split(",")*.trim().collect { entry ->
        String[] parts = entry.split(":")
        if (parts.length != 2 || !(parts[1] in types)) {
            throw new GradleException("${property} entry '${entry}' is not <name>:<${types.join('|')}>")
        }
        return parts
    } : []
}
def modrinthDependencies = {
    typedList("modrinth_dependencies", ["required", "optional", "incompatible", "embedded"]).collect {
        [project_id: it[0], dependency_type: it[1]]
    }
}
def curseRelations = {
    typedList("curse_relations", ["requiredDependency", "optionalDependency", "embeddedLibrary", "incompatible", "tool"]).collect {
        [slug: it[0], type: it[1]]
    }
}

/** The JSON answer of an HTTP request; fails with the server's message on an error status. */
def readResponse = { HttpURLConnection connection, String what ->
    int status = connection.responseCode
    String response = (status < 400 ? connection.inputStream : connection.errorStream)?.getText("UTF-8")
    if (status >= 400) {
        throw new GradleException("${what} failed (HTTP ${status}): ${response}")
    }
    return new JsonSlurper().parseText(response)
}

def getJson = { String url, Map<String, String> headers, String what ->
    HttpURLConnection connection = (HttpURLConnection) new URL(url).openConnection()
    headers.each { key, value -> connection.setRequestProperty(key, value) }
    return readResponse(connection, what)
}

/** POSTs a JSON part (dataName) and a jar (fileName) as multipart/form-data; returns the JSON answer. */
def postJar = { String url, Map<String, String> headers, String dataName, Map data, String fileName, File file, String what ->
    String boundary = "----omtteam" + UUID.randomUUID().toString().replace("-", "")
    HttpURLConnection connection = (HttpURLConnection) new URL(url).openConnection()
    connection.requestMethod = "POST"
    connection.doOutput = true
    headers.each { key, value -> connection.setRequestProperty(key, value) }
    connection.setRequestProperty("Content-Type", "multipart/form-data; boundary=${boundary}")
    connection.outputStream.withStream { out ->
        def write = { String text -> out.write(text.getBytes("UTF-8")) }
        write("--${boundary}\r\nContent-Disposition: form-data; name=\"${dataName}\"\r\nContent-Type: application/json\r\n\r\n")
        write(JsonOutput.toJson(data))
        write("\r\n--${boundary}\r\nContent-Disposition: form-data; name=\"${fileName}\"; filename=\"${file.name}\"\r\nContent-Type: application/java-archive\r\n\r\n")
        file.withInputStream { out << it }
        write("\r\n--${boundary}--\r\n")
    }
    return readResponse(connection, what)
}

/** Runs git in the mod folder: [exit code, output, error output]. */
def runGit = { String... args ->
    def process = (["git"] + args.toList()).execute(null, projectDir)
    def out = new StringBuilder()
    def err = new StringBuilder()
    process.waitForProcessOutput(out, err)
    return [process.exitValue(), out.toString().trim(), err.toString().trim()]
}

def git = { String... args ->
    def (code, out, err) = runGit(args)
    if (code != 0) {
        throw new GradleException("git ${args.join(' ')} failed: ${err}")
    }
    return out
}

/** Like git, but null instead of a failure (e.g. no tag yet). */
def gitOrNull = { String... args ->
    def (code, out, err) = runGit(args)
    return code == 0 ? out : null
}

/**
 * The previous release tag (v…) and the omlib_version in its gradle.properties ([tag, version], the version null if
 * that release had none); null if there is no earlier release tag.
 */
def previousOmlibVersion = {
    String tag = gitOrNull("describe", "--tags", "--abbrev=0", "--match", "v*")
    if (!tag) {
        return null
    }
    String text = gitOrNull("show", "${tag}:gradle.properties")
    Properties properties = new Properties()
    if (text != null) {
        properties.load(new StringReader(text))
    }
    return [tag, properties.getProperty("omlib_version")]
}

/** The version set in the gradle.properties of the OMLib checkout next to this mod (the workspace), null if there is none. */
def siblingOmlibVersion = {
    File file = new File(projectDir.parentFile, "OMLib/gradle.properties")
    if (!file.isFile() || file.canonicalFile == project.file("gradle.properties").canonicalFile) {
        return null
    }
    Properties properties = new Properties()
    file.withInputStream { properties.load(it) }
    return composeVersion(properties.getProperty("mod_version"), properties.getProperty("release_type") ?: "release",
            properties.getProperty("release_number"))
}

// Players have to update OMLib too, so a new OMLib requirement belongs into the release notes. Its own task, so every
// upload depends on it directly (also when checkRelease is skipped with -x).
tasks.register("checkOmlibChangelog") {
    group = "release"
    description = "Fails if omlib_version changed since the previous release tag and the version's CHANGELOG.md section does not mention it"
    onlyIf { project.hasProperty("omlib_version") }
    doLast {
        def previous = previousOmlibVersion()
        if (previous != null && previous[1] != omlib_version
                && !(releaseNotes ?: "").contains("OMLib ${omlib_version}")) {
            throw new GradleException("omlib_version changed since ${previous[0]} (${previous[1]} -> ${omlib_version}), "
                    + "but the CHANGELOG.md section of ${version} does not say so; add "
                    + "\"Requires OMLib ${omlib_version} or newer\" under ### Changed")
        }
    }
}

tasks.register("checkRelease") {
    group = "release"
    description = "Checks that the version, its CHANGELOG.md section, the tokens and the git tree are ready for a release"
    dependsOn "checkOmlibChangelog"
    doLast {
        if (!releaseNotes) {
            throw new GradleException("CHANGELOG.md has no section for ${version}; run ./gradlew releaseChangelog and commit it first")
        }
        if (!findProperty("curseforge_token")) {
            throw new GradleException("curseforge_token is not set (~/.gradle/gradle.properties)")
        }
        curseRelations()
        if (modrinthProjectId) {
            if (!findProperty("modrinth_token")) {
                throw new GradleException("modrinth_token is not set (~/.gradle/gradle.properties)")
            }
            def placeholders = modrinthDependencies().findAll { it.project_id.startsWith("TODO") }
            if (!placeholders.isEmpty()) {
                throw new GradleException("modrinth_dependencies still has placeholders: ${placeholders*.project_id.join(', ')}")
            }
        }
        if (project.hasProperty("omlib_version")) {
            String omlib = siblingOmlibVersion()
            if (omlib != null && omlib != omlib_version) {
                throw new GradleException("omlib_version is ${omlib_version}, but ../OMLib is set to ${omlib}")
            }
        }
        if (!git("status", "--porcelain").isEmpty()) {
            throw new GradleException("The git working tree has uncommitted changes; commit them before releasing")
        }
        if (!git("tag", "--list", "v${version}").isEmpty()) {
            throw new GradleException("Tag v${version} already exists")
        }
        logger.lifecycle("Releasing ${mod_id} ${version} (${releaseChannel}) to CurseForge" + (modrinthProjectId ? " and Modrinth" : ""))
    }
}

tasks.register("curseforge") {
    group = "release"
    description = "Uploads the jar (with the sources and dev jars as additional files) to CurseForge"
    dependsOn "checkOmlibChangelog", "checkRelease", "build"
    doLast {
        Map<String, String> headers = ["X-Api-Token": findProperty("curseforge_token").toString(), "User-Agent": userAgent]
        // game version names -> ids, among the types the Minecraft upload API accepts
        def types = getJson("${curseforgeApi}/game/version-types", headers, "CurseForge version types").findAll {
            it.slug.startsWith("minecraft") || it.slug in ["modloader", "environment", "java"]
        }*.id as Set
        def known = getJson("${curseforgeApi}/game/versions", headers, "CurseForge game versions").findAll {
            it.gameVersionTypeID in types
        }
        List<Integer> gameVersions = curseGameVersions.collect { name ->
            def matches = known.findAll { it.name == name }
            if (matches.size() != 1) {
                throw new GradleException("CurseForge game version '${name}': ${matches.size()} matches (${matches*.id})")
            }
            return matches[0].id as Integer
        }
        String url = "${curseforgeApi}/projects/${curse_project_id}/upload-file"
        File main = tasks.reobfJar.archiveFile.get().asFile
        Map metadata = [changelog: releaseNotes, changelogType: "markdown", releaseType: releaseChannel, gameVersions: gameVersions]
        def relations = curseRelations()
        if (!relations.isEmpty()) {
            metadata.relations = [projects: relations]
        }
        def fileId = postJar(url, headers, "metadata", metadata, "file", main, "CurseForge upload of ${main.name}").id
        logger.lifecycle("CurseForge: uploaded ${main.name} as file ${fileId} of project ${curse_project_id}")
        ["sourcesJar", "jar"].collect { tasks.findByName(it) }.findAll { it != null }.each { jarTask ->
            File extra = jarTask.archiveFile.get().asFile
            Map extraMetadata = [changelog: releaseNotes, changelogType: "markdown", releaseType: "alpha", parentFileID: fileId]
            try {
                postJar(url, headers, "metadata", extraMetadata, "file", extra, "CurseForge upload of ${extra.name}")
            } catch (GradleException e) {
                throw new GradleException("${e.message}\nThe main file ${fileId} is uploaded already; add ${extra.name} to it by hand or delete it before releasing again")
            }
            logger.lifecycle("CurseForge: uploaded ${extra.name} as additional file of ${fileId}")
        }
    }
}

tasks.register("modrinth") {
    group = "release"
    description = "Uploads the jar to Modrinth (skipped while modrinth_project_id is not set)"
    dependsOn "checkOmlibChangelog", "checkRelease", "build"
    mustRunAfter "curseforge"
    doLast {
        if (!modrinthProjectId) {
            logger.lifecycle("Modrinth: modrinth_project_id is not set, upload skipped")
            return
        }
        File file = tasks.reobfJar.archiveFile.get().asFile
        Map data = [
                project_id    : modrinthProjectId,
                name          : "${mod_id_cap} ${version}".toString(),
                version_number: "${minecraft_version}-${version}".toString(),
                changelog     : releaseNotes,
                dependencies  : modrinthDependencies(),
                game_versions : [minecraft_version],
                loaders       : ["forge"],
                version_type  : releaseChannel,
                featured      : false,
                file_parts    : ["file0"],
                primary_file  : "file0"
        ]
        Map<String, String> headers = ["Authorization": findProperty("modrinth_token").toString(), "User-Agent": userAgent]
        def uploaded = postJar("${modrinthApi}/version", headers, "data", data, "file0", file, "Modrinth upload")
        logger.lifecycle("Modrinth: uploaded ${file.name} as version ${uploaded.version_number} (https://modrinth.com/mod/${modrinthProjectId}/version/${uploaded.id})")
    }
}

tasks.register("release") {
    group = "release"
    description = "Builds the version in gradle.properties, uploads it to CurseForge and Modrinth and tags it as v<version>"
    dependsOn "checkRelease", "build", "curseforge", "modrinth"
    doLast {
        git("tag", "-a", "v${version}", "-m", "${mod_id_cap} ${version}")
        logger.lifecycle("Tagged v${version}")
    }
}
